<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Paths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;}
:root{
  color-scheme:light dark;
  --bg:#f5f6fa;
  --surface:#ffffff;
  --surface-2:#eceff6;
  --border:#dde1ea;
  --text:#1b2130;
  --text-dim:#5c6579;
  --text-faint:#8891a3;
  --accent:#2f5fae;
  --accent-soft:#e3ecfb;
  --gold:#93650f;
  --gold-soft:#f6ecd8;
  --danger:#b3413a;
  --radius:12px;
  --shadow:0 1px 2px rgba(20,30,60,.07),0 1px 1px rgba(20,30,60,.04);
  --font-display:'Manrope','Segoe UI',system-ui,sans-serif;
  --font-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'Cascadia Code',monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1320;
    --surface:#171c2c;
    --surface-2:#1e2436;
    --border:#2b3348;
    --text:#e8eaf5;
    --text-dim:#a6adc4;
    --text-faint:#727ba0;
    --accent:#7fb0e8;
    --accent-soft:#1f3654;
    --gold:#e3b567;
    --gold-soft:#3a2e17;
    --danger:#e08079;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1320;
  --surface:#171c2c;
  --surface-2:#1e2436;
  --border:#2b3348;
  --text:#e8eaf5;
  --text-dim:#a6adc4;
  --text-faint:#727ba0;
  --accent:#7fb0e8;
  --accent-soft:#1f3654;
  --gold:#e3b567;
  --gold-soft:#3a2e17;
  --danger:#e08079;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
/* Per-path accent. Azure keeps the root blue; each other tab gets its own hue
   so the tab you are on is obvious without reading the label. */
[data-path="java"]       {--accent:#0f766e;--accent-soft:#d9f2ee;}
[data-path="distributed"]{--accent:#6d4aad;--accent-soft:#eae3f8;}
[data-path="scaling"]    {--accent:#2f7a46;--accent-soft:#dcf0e2;}
[data-path="events"]     {--accent:#a13a76;--accent-soft:#f9e3f1;}
[data-path="design"]     {--accent:#a8453a;--accent-soft:#fae3e0;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) [data-path="java"]       {--accent:#5fd0c3;--accent-soft:#12403c;}
  :root:not([data-theme="light"]) [data-path="distributed"]{--accent:#b49ae8;--accent-soft:#2d2247;}
  :root:not([data-theme="light"]) [data-path="scaling"]    {--accent:#6fd090;--accent-soft:#163a25;}
  :root:not([data-theme="light"]) [data-path="events"]     {--accent:#ef92c9;--accent-soft:#411733;}
  :root:not([data-theme="light"]) [data-path="design"]     {--accent:#ef938a;--accent-soft:#45201c;}
}
:root[data-theme="dark"] [data-path="java"]       {--accent:#5fd0c3;--accent-soft:#12403c;}
:root[data-theme="dark"] [data-path="distributed"]{--accent:#b49ae8;--accent-soft:#2d2247;}
:root[data-theme="dark"] [data-path="scaling"]    {--accent:#6fd090;--accent-soft:#163a25;}
:root[data-theme="dark"] [data-path="events"]     {--accent:#ef92c9;--accent-soft:#411733;}
:root[data-theme="dark"] [data-path="design"]     {--accent:#ef938a;--accent-soft:#45201c;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;}
img{max-width:100%;}
[hidden]{display:none!important;}
a{color:inherit;}
code{font-family:var(--font-mono);font-size:.9em;}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 90px;}
.kicker{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;color:var(--accent);font-weight:600;margin:0 0 10px;}
h1{font-family:var(--font-display);font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em;}
.subtitle{color:var(--text-dim);font-size:.98rem;line-height:1.55;max-width:62ch;margin:0 0 22px;}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:1;}
.bar.big{height:10px;}
.bar-fill{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .25s ease;}
.overall{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.overall-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--text-dim);}
.save-status{padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:.74rem;white-space:nowrap;}
.save-status.status-local{color:var(--text-faint);}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:22px;font-size:.8rem;color:var(--text-dim);}
.legend-item{display:flex;align-items:center;gap:6px;}
.pill{display:inline-flex;align-items:center;font-family:var(--font-mono);font-weight:600;font-size:.66rem;letter-spacing:.02em;padding:2px 8px;border-radius:999px;line-height:1.6;}
.pill.gold{background:var(--gold-soft);color:var(--gold);}
/* Tabs */
.site-head{margin-bottom:20px;}
.site-kicker{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;color:var(--text-faint);font-weight:600;margin:0 0 12px;}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px;}
.tab{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:inherit;cursor:pointer;box-shadow:var(--shadow);}
.tab:hover{border-color:var(--accent);}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);}
.tab-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.tab-label{font-family:var(--font-display);font-weight:700;font-size:.92rem;line-height:1.2;}
.tab-count{font-family:var(--font-mono);font-size:.68rem;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap;}
.tab-sub{font-size:.72rem;color:var(--text-dim);line-height:1.3;}
.tab .bar{height:4px;margin-top:6px;flex:none;}
/* .NET -> Java map */
details.map{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;}
details.map>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;font-family:var(--font-display);font-weight:700;font-size:.98rem;}
details.map>summary::-webkit-details-marker{display:none;}
details.map>summary::after{content:'+';font-family:var(--font-mono);font-size:1.1rem;color:var(--accent);}
details.map[open]>summary::after{content:'\2212';}
.map-hint{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--text-dim);}
.map-grid{display:grid;grid-template-columns:1fr 1fr;padding:0 18px 12px;font-size:.84rem;}
.map-grid>div{padding:7px 8px;border-top:1px solid var(--border);}
.map-grid .head{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.07em;font-size:.68rem;color:var(--text-faint);border-top:0;}
.map-grid .to{color:var(--accent);font-weight:500;}
.navchips{display:flex;gap:8px;overflow-x:auto;padding-block:10px;margin:0 -20px 26px;padding-inline:20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;}
.chip{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--text);min-width:126px;max-width:170px;}
.chip:hover,.chip:focus-visible{border-color:var(--accent);}
.chip.core{border-top:2px solid var(--gold);}
.chip.complete{border-color:var(--accent);background:var(--accent-soft);}
.chip-num{font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint);}
.chip-title{font-size:.76rem;font-weight:600;line-height:1.25;}
.chip-count{font-family:var(--font-mono);font-size:.7rem;color:var(--text-dim);font-variant-numeric:tabular-nums;}
.phase{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 18px;margin-bottom:18px;scroll-margin-top:76px;}
.eyebrow-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.eyebrow{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--accent);font-weight:600;}
.phase-title{font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin:0 0 6px;text-wrap:balance;}
.phase-desc{color:var(--text-dim);font-size:.9rem;margin:0 0 14px;max-width:64ch;}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.progress-count{font-family:var(--font-mono);font-size:.78rem;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;}
.items{display:flex;flex-direction:column;gap:2px;}
.item{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer;}
.item:hover{background:var(--surface-2);}
.chk{width:19px;height:19px;flex-shrink:0;margin-top:2px;accent-color:var(--accent);cursor:pointer;}
.item-body{display:flex;flex-direction:column;gap:4px;}
.item-text{font-size:.94rem;line-height:1.45;}
.item.done .item-text{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--border);}
.item-note{font-size:.8rem;color:var(--text-dim);line-height:1.42;padding-left:9px;border-left:2px solid var(--border);}
footer.page-footer{color:var(--text-faint);font-size:.78rem;text-align:center;margin-top:10px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){.bar-fill{transition:none;}}
@media (max-width:480px){
  .wrap{padding:20px 16px 70px;}
  .phase{padding:18px 16px 14px;}
  .chip{min-width:108px;}
  .tab{flex:1 1 100%;}
  .map-grid{padding:0 10px 10px;font-size:.8rem;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Item ids are derived from position (p<phase>i<index>) and saved progress is keyed on them,
// so add new items at the END of a phase's list to keep existing progress intact.

const AZURE_PHASES = [
  {
    id:'p1', num:'01', tag:null,

    desc:`Get your tools and account ready before touching any service.`,
    items:[

      {text:`Install the Azure CLI (az) and sign in with az login`},
      {text:`Install Azure PowerShell (the Az module) — optional if you prefer the CLI`},
      {text:`Install VS Code extensions: Azure Tools, Azure App Service, Bicep`},
      {text:`Confirm the Azure workload is installed in Visual Studio, for one-click publish`},

  {

    title:`Core Cloud Concepts`,

    items:[
      {text:`IaaS vs PaaS vs SaaS — and which Azure services fall where`},
      {text:`Regions, availability zones, and region pairs`},
      {text:`Subscriptions, management groups, and resource groups — the hierarchy`},
      {text:`Azure Resource Manager (ARM) — how every action becomes a resource operation`, deep:true, note:`Understand this first — Bicep, the CLI and the Portal all call the same Resource Manager API underneath.`},
      {text:`Naming conventions and a tagging strategy (env, owner, cost-center)`},
      {text:`Pricing Calculator and Cost Management plus Budgets`},

  {

      {text:`Secure an Angular SPA with @azure/msal-angular`},
      {text:`Secure an ASP.NET Core Web API with Microsoft.Identity.Web / JWT bearer validation`},

      {text:`Deploy an ASP.NET Core Web API to App Service from Visual Studio, VS Code, or the CLI`, deep:true, note:`Start with a right-click publish, then redo the same deploy through a pipeline once you reach Phase 9.`},
      {text:`App settings and connection strings — how they map onto appsettings.json`},
      {text:`Deployment slots — stage a release, then swap it into production`, deep:true, note:`A swap instead of a redeploy is what makes a release a non-event instead of a maintenance window.`},

      {text:`Azure Functions, C# isolated worker model: HTTP and timer triggers, bindings`},
      {text:`Containerize a .NET API with Docker and push it to Azure Container Registry`},
      {text:`Azure Container Apps — deploy the containerized API, revisions, scale-to-zero`},
      {text:`Azure Kubernetes Service — know what it is for; do not rabbit-hole into it yet`},
    ]
  },
  {
    id:'p5', num:'05', tag:'Core focus',
    title:`Data Platform — PostgreSQL on Azure`,
    desc:`Your database. This is the section to actually slow down on.`,
    items:[
      {text:`Azure Database for PostgreSQL – Flexible Server: provisioning, burstable vs general-purpose tiers`, deep:true, note:`Burstable (B-series) is fine for learning; move to General Purpose before anything real depends on it.`},

      {text:`Static Web Apps built-in auth vs bringing your own MSAL flow`},
      {text:`Alternative: serve Angular from App Service, same host as the API or separate`},
      {text:`Azure CDN / Azure Front Door for caching static assets globally`, deep:true, note:`Front Door also gives you a WAF and path-based routing — worth it once the SPA and API live on different hosts.`},

const JAVA_PHASES = [
  {
    id:'p1', num:'01', tag:null,
    title:`Environment and Java Fundamentals`,
    desc:`Get a JDK running and learn where Java differs from C#. You already know how to program — this phase is about the differences.`,
    items:[
      {text:`Install a current LTS JDK (21 or newer; 25 is the latest LTS) via SDKMAN or a Temurin installer, and run java, javac and jshell by hand once`},
      {text:`Set up IntelliJ IDEA (or VS Code with the Java extension pack): run configurations, debugger, refactorings, Maven import`},
      {text:`The pipeline: .java → javac → .class → JVM → JIT. Packages, the classpath, and the src/main/java layout`},
      {text:`Classes, interfaces, enums and access modifiers — plus what C# has that Java lacks: properties, partial classes, structs, operator overloading`},
      {text:`Records, sealed interfaces, and pattern matching for switch — the modern answers to DTO boilerplate and discriminated unions`, deep:true, note:`Learn the modern form first, so you can still recognise the getter/setter/Lombok style in older code.`},
      {text:`Primitives vs wrapper types, autoboxing, and the == vs equals() trap; String immutability, StringBuilder and text blocks`, deep:true, note:`Integer caching makes == appear to work for small values (-128 to 127) and then fail on larger ones.`},
      {text:`Checked vs unchecked exceptions, try-with-resources (Java's using), and custom exception hierarchies`, deep:true, note:`Checked exceptions are the biggest culture shock coming from C#. Spring code mostly wraps them in unchecked ones — know why.`},
      {text:`Practice: a console library app (add, borrow and return books) using classes, interfaces, enums, records and exceptions`},
    ]
  },
  {
    id:'p2', num:'02', tag:null,
    title:`Collections, Generics and Streams`,
    desc:`The standard library you will touch every day. Your LINQ instincts transfer, with a few sharp edges.`,
    items:[
      {text:`List, Set, Map, Queue and Deque with their main implementations — ArrayList, HashSet, HashMap, TreeMap, ArrayDeque, PriorityQueue — and when to pick each; immutable List.of and Map.of`},
      {text:`HashMap internals and the equals()/hashCode() contract`, deep:true, note:`Mutating an object that is used as a key silently loses it in the map. An interview staple and a real-world bug source.`},
      {text:`Generics: type erasure (versus reified generics in .NET), bounded types, and the ? extends / ? super wildcards`, deep:true, note:`Rule of thumb: Producer Extends, Consumer Super. Erasure is why you cannot write new T() or List<int>.`},
      {text:`Lambdas, method references, and the core functional interfaces: Predicate, Function, Consumer, Supplier`},
      {text:`Streams and Collectors: filter, map, flatMap, sorted, reduce, groupingBy, partitioningBy, toMap`, deep:true, note:`Streams are lazy and single-use — unlike an IEnumerable you cannot enumerate one twice, and nothing runs until a terminal operation.`},
      {text:`Optional: map, flatMap, orElseGet, orElseThrow — and when not to use it (fields, parameters, collections); null handling without nullable reference types`},
      {text:`Practice: solve 10–15 stream problems without looking anything up — group by, top-N, dedupe, flatten, list to map`},
    ]
  },
  {
    id:'p3', num:'03', tag:null,
    title:`JVM, Build Tools and Logging`,
    desc:`How Java actually runs and how projects are built. Keep it practical — real tuning comes later, once you have a workload.`,
    items:[
      {text:`JDK vs JRE vs JVM, bytecode, class loading, and tiered JIT compilation (C1/C2) — compared side by side with the CLR`},
      {text:`Memory layout: heap (young and old generations), thread stacks, metaspace — and what each OutOfMemoryError message points to`},
      {text:`Garbage collection basics: what stop-the-world means, and how G1 (the default), ZGC and Shenandoah differ in goals`, note:`Enough to explain the throughput-vs-latency trade-off. Do not tune collectors yet.`},
      {text:`Maven: pom.xml, the lifecycle (compile, test, package, verify), dependency scopes, the Maven Wrapper (mvnw), and multi-module projects with a parent POM`},
      {text:`Dependency management: BOMs and dependencyManagement, and mvn dependency:tree to diagnose version conflicts`, note:`Spring Boot's parent POM pins compatible versions for hundreds of libraries — override them sparingly.`},
      {text:`Logging: the SLF4J API over Logback, log levels, parameterised messages, and MDC for correlation IDs`},
      {text:`Diagnostics toolbelt: jcmd, jstack thread dumps, heap dumps, and Java Flight Recorder (JFR)`, deep:true, note:`Read a thread dump of a toy app before you have to read one from production.`},

  {
    id:'p4', num:'04', tag:'Core focus',
    title:`Spring Core and Spring Boot`,
    desc:`Where Java becomes ASP.NET Core-shaped. Map every concept to the one you already know.`,
    items:[
      {text:`IoC container and dependency injection: constructor injection over field injection; ApplicationContext as the IServiceProvider equivalent`},
      {text:`Stereotypes and configuration: @Component, @Service, @Repository, @Configuration, @Bean, and how component scanning finds them`},
      {text:`Bean scopes and lifecycle: singleton (the default), prototype, request; @PostConstruct and @PreDestroy`, deep:true, note:`The default scope is singleton — the opposite of the ASP.NET Core instinct to reach for scoped. Singleton beans must be thread-safe.`},
      {text:`Spring Boot: @SpringBootApplication, starters, the embedded server, and auto-configuration`, deep:true, note:`Run with --debug to print the auto-configuration conditions report. It removes most of the magic.`},
      {text:`Configuration: application.yml, @ConfigurationProperties (the IOptions<T> equivalent), profiles, and environment-variable overrides`},
      {text:`The request pipeline: servlet Filter → DispatcherServlet → HandlerInterceptor → controller, compared with ASP.NET Core middleware`},

      {text:`AOP and proxies: how @Transactional, @Cacheable and @Async actually work`, deep:true, note:`Calling a @Transactional method from another method in the same class bypasses the proxy, so no transaction starts. One of the most common Spring bugs.`},
      {text:`In-process events with ApplicationEventPublisher and background work with @Scheduled — the MediatR-notification and IHostedService equivalents`},

    title:`Persistence — JPA, Hibernate and Flyway`,
    desc:`Your EF Core equivalent — and where Java teams get burned most often. Slow down here.`,
    items:[
      {text:`The stack: Spring Data JPA → JPA → Hibernate → JDBC (pgjdbc) → PostgreSQL, with HikariCP as the connection pool`},
      {text:`Entity mapping: @Entity, @Id, ID generation (identity vs sequence, and what it means for batching), @Column, enums, @Embeddable`},
      {text:`Repositories: derived query methods, @Query with JPQL, projections, and native queries`},
      {text:`Relationships: @OneToMany, @ManyToOne, @ManyToMany, the owning side, cascade, orphanRemoval — and why LAZY is the right default`, deep:true, note:`In JPA, @ManyToOne and @OneToOne default to EAGER. Switch them to LAZY explicitly.`},
      {text:`The persistence context: first-level cache, dirty checking, flush timing, and entity states (managed, detached)`, deep:true, note:`Closest to the EF change tracker, but a managed entity is written by dirty checking at flush — you often never call save().`},
      {text:`N+1 queries: spot them with SQL logging, fix them with JOIN FETCH, @EntityGraph or batch fetching, and assert query counts in tests`, deep:true},
      {text:`@Transactional: propagation, isolation, read-only, and rollback rules`, deep:true, note:`By default only unchecked exceptions roll a transaction back — a checked exception commits. Put transaction boundaries in the service layer.`},

      {text:`Escape hatches: JdbcClient/JdbcTemplate, Spring Data JDBC and jOOQ — for reporting queries and bulk work where JPA is the wrong tool (the Dapper role)`},

    id:'p7', num:'07', tag:null,

    items:[
      {text:`Index types and design: B-tree, GIN, GiST and BRIN, partial and covering (INCLUDE) indexes, multicolumn ordering`},
      {text:`EXPLAIN (ANALYZE, BUFFERS): read plans, spot sequential scans and bad row estimates, and find your worst queries with pg_stat_statements`, deep:true},

      {text:`Window functions, CTEs and lateral joins — the reporting queries you would otherwise write badly in application code`},

      {text:`Extensions worth knowing: pg_stat_statements, pgcrypto, PostGIS, TimescaleDB, pgvector`},

    id:'p8', num:'08', tag:'Core focus',
    title:`Spring Security, OAuth2 and JWT`,

    items:[
      {text:`Authentication vs authorization, and the SecurityFilterChain with the lambda DSL — compared with ASP.NET Core auth middleware`},

      {text:`JWT end to end: issue, sign and validate; short-lived access tokens plus refresh tokens`, deep:true, note:`Build it by hand once as a learning exercise, then switch to Spring's OAuth2 resource server — production systems validate tokens from an identity provider, not from a hand-rolled filter.`},
      {text:`Roles vs authorities, method security with @PreAuthorize, ownership checks, and tests with @WithMockUser and the jwt() MockMvc post-processor asserting 401 vs 403`, deep:true, note:`Broken object-level authorization — user A reading user B's record — is the top API vulnerability. Write a test for it.`},
      {text:`OAuth 2.0 and OpenID Connect: Authorization Code with PKCE, and Client Credentials`, deep:true},
      {text:`Run Keycloak locally in Docker as your identity provider — realms, clients, roles, and mapping token claims to Spring authorities`},

    id:'p9', num:'09', tag:null,

    items:[
      {text:`Threads, Runnable and Callable, ExecutorService, and sizing thread pools for CPU-bound vs I/O-bound work`},

    id:'p13', num:'13', tag:null,
    title:`Docker, Kubernetes and Delivery`,

    items:[
      {text:`Container images for Spring Boot: multi-stage Dockerfile or Buildpacks/Jib, layered jars, non-root user, slim JRE base image`},

  ['Service Bus peek-lock + complete', 'Rabbit ack / Kafka offset commit'],
  ['MassTransit / NServiceBus', 'Spring for Kafka / Spring Cloud Stream'],
  ['Azure Functions trigger', '@KafkaListener / @RabbitListener'],
  ['Durable Functions', 'Temporal / Camunda (saga orchestration)'],
  ['Azure Stream Analytics', 'Kafka Streams / Flink'],
  ['Schema Registry (Event Hubs)', 'Confluent Schema Registry'],
];

const PATHS = [
  {
    id:'azure',
    label:'Azure',
    sublabel:'One cloud, in depth',
    kicker:'Azure learning path',
    title:'Azure Study Path',
    subtitle:'Built for a C#/.NET, PostgreSQL, and Angular developer — from your first <code>az login</code> to a certified, production-shaped deployment.',
    phases:AZURE_PHASES,
  },
  {
    id:'java',
    label:'Java',
    sublabel:'Language, Spring, persistence',
    kicker:'Java learning path',
    title:'Java Full-Stack Study Path',
    subtitle:'Built for a C#/.NET, PostgreSQL, and Angular developer — from your first <code>javac</code> to a production Spring Boot service. The systems tabs alongside this one are language-neutral.',
    map:{heads:['.NET', 'Java'], title:'Your .NET → Java map', hint:'what each tool you know becomes', rows:DOTNET_TO_JAVA},
    // v2: the systems phases moved out to their own tabs, so phase numbering shifted
    // and old p12+ checkmarks would land on different items. Fresh key rather than misalign.
    store:'java-v2',
    phases:JAVA_PHASES,
  },
  {
    id:'distributed',
    label:'Distributed Systems',
    sublabel:'Failure, consistency, consensus',
    kicker:'Distributed systems',
    title:'Distributed Systems',
    subtitle:'The theory underneath every other tab — partial failure, consistency, replication, consensus, and the patterns that keep a multi-service system correct. Language-neutral.',
    phases:DISTRIBUTED_PHASES,
  },
  {
    id:'scaling',
    label:'Scaling',
    sublabel:'From one instance to many',
    kicker:'Scaling systems',
    title:'Scaling Systems',
    subtitle:'Measuring first, then the levers in the order they are usually worth pulling — stateless services, caching, the database ladder, load management, elasticity. Language-neutral.',
    phases:SCALING_PHASES,
  },
  {
    id:'events',
    label:'Event-Driven',
    sublabel:'Kafka, patterns, correctness',
    kicker:'Event-driven architecture',
    title:'Event-Driven Architecture',
    subtitle:'Brokers, delivery guarantees, schemas, and the integration patterns — outbox, CDC, saga, CQRS — that make an asynchronous system correct rather than merely asynchronous.',
    map:{heads:['Azure / .NET', 'Kafka / Java / OSS'], title:'Messaging equivalents', hint:'what you know, in the open-source stack', rows:MESSAGING_MAP},
    phases:EVENTS_PHASES,
  },
  {
    id:'design',
    label:'System Design',
    sublabel:'Apply it under constraints',
    kicker:'System design practice',
    title:'System Design Practice',
    subtitle:'Where the other tabs get spent — a repeatable method, the building blocks, and a set of problems to work end to end and write up.',
    phases:DESIGN_PHASES,
  },
];

PATHS.forEach(function(path){
  path.phases.forEach(function(p){
    p.items.forEach(function(it, i){ it.id = p.id + 'i' + (i + 1); });
  });
});

const STORE_PREFIX = 'study-path:';
const TAB_KEY = STORE_PREFIX + 'active';
const states = {};
let storageOk = true;

function storeGet(key){
  try { return localStorage.getItem(key); }
  catch (e) { storageOk = false; return null; }
}
function storeSet(key, value){
  if (!storageOk) return;
  try { localStorage.setItem(key, value); }
  catch (e) { storageOk = false; }
}
function storeKeyFor(pathId){
  const path = PATHS.find(function(p){ return p.id === pathId; });
  return STORE_PREFIX + ((path && path.store) || pathId);
}
function loadStates(){
  PATHS.forEach(function(path){
    const set = new Set();
    const raw = storeGet(storeKeyFor(path.id));
    if (raw){
      try {
        const ids = JSON.parse(raw);
        if (Array.isArray(ids)) ids.forEach(function(id){ set.add(id); });
      } catch (e) {}
    }
    states[path.id] = set;
  });
}
function saveState(pathId){
  storeSet(storeKeyFor(pathId), JSON.stringify(Array.from(states[pathId])));
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pctOf(done, total){ return total ? Math.round((done / total) * 100) : 0; }
function countPhase(pathId, phase){
  const set = states[pathId];
  const done = phase.items.filter(function(i){ return set.has(i.id); }).length;
  return {done:done, total:phase.items.length};
}
function countPath(path){
  let done = 0, total = 0;
  path.phases.forEach(function(p){
    const c = countPhase(path.id, p);
    done += c.done;
    total += c.total;
  });
  return {done:done, total:total};
}

function renderTabs(){
  return '<div class="site-head">' +
    '<p class="site-kicker">Study paths</p>' +
    '<div class="tabs" role="tablist" aria-label="Study paths">' +
      PATHS.map(function(path, i){
        return '<button class="tab" role="tab" type="button" id="tab-' + path.id + '"' +
          ' aria-controls="panel-' + path.id + '" aria-selected="' + (i === 0) + '"' +
          ' tabindex="' + (i === 0 ? '0' : '-1') + '" data-tab="' + path.id + '" data-path="' + path.id + '">' +
          '<span class="tab-top">' +
            '<span class="tab-label">' + esc(path.label) + '</span>' +
            '<span class="tab-count" data-tabcount="' + path.id + '"></span>' +
          '</span>' +
          '<span class="tab-sub">' + esc(path.sublabel) + '</span>' +
          '<span class="bar"><span class="bar-fill" data-tabfill="' + path.id + '"></span></span>' +
        '</button>';
      }).join('') +
    '</div>' +
  '</div>';
}
function renderItem(pathId, item){
  const checked = states[pathId].has(item.id);
  return '<label class="item' + (checked ? ' done' : '') + '">' +
    '<input type="checkbox" class="chk" data-path-id="' + pathId + '" data-id="' + item.id + '"' + (checked ? ' checked' : '') + '>' +
    '<span class="item-body">' +
      '<span class="item-text">' + esc(item.text) + (item.deep ? ' <span class="pill gold">Deep dive</span>' : '') + '</span>' +
      (item.note ? '<span class="item-note">' + esc(item.note) + '</span>' : '') +
    '</span>' +
  '</label>';
}
function renderPhase(pathId, phase){
  const key = pathId + '-' + phase.id;
  return '<section class="phase" id="' + key + '">' +
    '<div class="eyebrow-row">' +
      '<span class="eyebrow">Phase ' + phase.num + '</span>' +
      (phase.tag ? '<span class="pill gold">' + esc(phase.tag) + '</span>' : '') +
    '</div>' +
    '<h2 class="phase-title">' + esc(phase.title) + '</h2>' +
    '<p class="phase-desc">' + esc(phase.desc) + '</p>' +
    '<div class="progress-row">' +
      '<div class="bar"><div class="bar-fill" data-fill="' + key + '"></div></div>' +
      '<span class="progress-count" data-count="' + key + '"></span>' +
    '</div>' +
    '<div class="items">' + phase.items.map(function(i){ return renderItem(pathId, i); }).join('') + '</div>' +
  '</section>';
}
function renderNav(path){
  return '<nav class="navchips" aria-label="Jump to phase">' +
    path.phases.map(function(p){
      const key = path.id + '-' + p.id;
      return '<a href="#' + key + '" class="chip' + (p.tag ? ' core' : '') + '" data-chip="' + key + '">' +
        '<span class="chip-num">' + p.num + '</span>' +
        '<span class="chip-title">' + esc(p.title) + '</span>' +
        '<span class="chip-count"></span>' +
      '</a>';
    }).join('') +
  '</nav>';
}
function renderMap(path){
  if (!path.map) return '';
  return '<details class="map">' +
    '<summary><span>' + esc(path.map.title) + '</span><span class="map-hint">' + esc(path.map.hint) + '</span></summary>' +
    '<div class="map-grid">' +
      '<div class="head">' + esc(path.map.heads[0]) + '</div><div class="head">' + esc(path.map.heads[1]) + '</div>' +
      path.map.rows.map(function(r){
        return '<div>' + esc(r[0]) + '</div><div class="to">' + esc(r[1]) + '</div>';
      }).join('') +
    '</div>' +
  '</details>';
}
function renderPanel(path, i){
  return '<div class="panel" role="tabpanel" id="panel-' + path.id + '" aria-labelledby="tab-' + path.id + '"' +
    ' data-panel="' + path.id + '" data-path="' + path.id + '"' + (i === 0 ? '' : ' hidden') + '>' +
    '<header>' +
      '<p class="kicker">' + esc(path.kicker) + '</p>' +
      '<h1>' + esc(path.title) + '</h1>' +
      '<p class="subtitle">' + path.subtitle + '</p>' +
      '<div class="overall">' +
        '<div class="bar big"><div class="bar-fill" data-overallfill="' + path.id + '"></div></div>' +
        '<div class="overall-meta">' +
          '<span data-overalltext="' + path.id + '"></span>' +
          '<span class="save-status' + (storageOk ? '' : ' status-local') + '">' +
            (storageOk ? 'Progress saved in this browser' : 'Progress can’t be saved in this view') +
          '</span>' +
        '</div>' +
      '</div>' +
      '<div class="legend">' +
        '<span class="legend-item"><span class="pill gold">Core focus</span> phases to slow down on for this stack</span>' +
        '<span class="legend-item"><span class="pill gold">Deep dive</span> topics worth studying beyond the surface</span>' +
      '</div>' +
    '</header>' +
    renderMap(path) +
    renderNav(path) +
    '<main class="phases">' + path.phases.map(function(p){ return renderPhase(path.id, p); }).join('') + '</main>' +
  '</div>';
}
function renderBody(){
  return '<div class="wrap">' +
    renderTabs() +
    PATHS.map(renderPanel).join('') +
    '<footer class="page-footer">Check off items as you go — progress is saved per tab in this browser.</footer>' +
  '</div>';
}

function update(){
  PATHS.forEach(function(path){
    const all = countPath(path);
    const pct = pctOf(all.done, all.total);
    document.querySelector('[data-overallfill="' + path.id + '"]').style.width = pct + '%';
    document.querySelector('[data-overalltext="' + path.id + '"]').textContent =
      all.done + ' / ' + all.total + ' complete · ' + pct + '%';
    document.querySelector('[data-tabfill="' + path.id + '"]').style.width = pct + '%';
    document.querySelector('[data-tabcount="' + path.id + '"]').textContent = all.done + '/' + all.total;
    path.phases.forEach(function(p){
      const key = path.id + '-' + p.id;
      const c = countPhase(path.id, p);
      document.querySelector('[data-fill="' + key + '"]').style.width = pctOf(c.done, c.total) + '%';
      document.querySelector('[data-count="' + key + '"]').textContent = c.done + ' / ' + c.total;
      const chip = document.querySelector('[data-chip="' + key + '"]');
      chip.classList.toggle('complete', c.total > 0 && c.done === c.total);
      chip.querySelector('.chip-count').textContent = c.done + '/' + c.total;
    });
  });
}

function activate(pathId, opts){
  const known = PATHS.some(function(p){ return p.id === pathId; });
  if (!known) return;
  PATHS.forEach(function(p){
    const on = p.id === pathId;
    const tab = document.querySelector('[data-tab="' + p.id + '"]');
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
    document.querySelector('[data-panel="' + p.id + '"]').hidden = !on;
  });
  storeSet(TAB_KEY, pathId);
  if (opts && opts.focus) document.querySelector('[data-tab="' + pathId + '"]').focus();
  if (opts && opts.scrollTop) window.scrollTo(0, 0);
}

// A hash like #java-p12 should open the Java tab, not just fail to scroll.
function activateFromHash(){
  const hash = (location.hash || '').replace(/^#/, '');
  if (!hash) return false;
  const path = PATHS.find(function(p){ return hash.indexOf(p.id + '-') === 0; });
  if (!path) return false;
  activate(path.id);
  const target = document.getElementById(hash);
  if (target) target.scrollIntoView();
  return true;
}

loadStates();
document.getElementById('app').innerHTML = renderBody();
update();

if (!activateFromHash()){
  activate(storeGet(TAB_KEY) || PATHS[0].id);
}
window.addEventListener('hashchange', activateFromHash);

document.querySelector('.tabs').addEventListener('click', function(e){
  const tab = e.target.closest('[data-tab]');
  if (tab) activate(tab.dataset.tab, {scrollTop:true});
});
document.querySelector('.tabs').addEventListener('keydown', function(e){
  const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (!dir) return;
  e.preventDefault();
  const ids = PATHS.map(function(p){ return p.id; });
  const current = ids.indexOf(document.activeElement.dataset.tab);
  if (current < 0) return;
  activate(ids[(current + dir + ids.length) % ids.length], {focus:true});
});

document.getElementById('app').addEventListener('change', function(e){
  const t = e.target;
  if (!t.classList || !t.classList.contains('chk')) return;
  const pathId = t.dataset.pathId;
  if (t.checked) states[pathId].add(t.dataset.id); else states[pathId].delete(t.dataset.id);
  t.closest('.item').classList.toggle('done', t.checked);
  update();
  saveState(pathId);
});
</script>
</body>
</html>
