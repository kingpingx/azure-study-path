<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Paths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;}
:root{
  color-scheme:light dark;
  --bg:#f5f6fa;
  --surface:#ffffff;
  --surface-2:#eceff6;
  --border:#dde1ea;
  --text:#1b2130;
  --text-dim:#5c6579;
  --text-faint:#8891a3;
  --accent:#2f5fae;
  --accent-soft:#e3ecfb;
  --gold:#93650f;
  --gold-soft:#f6ecd8;
  --danger:#b3413a;
  --radius:12px;
  --shadow:0 1px 2px rgba(20,30,60,.07),0 1px 1px rgba(20,30,60,.04);
  --font-display:'Manrope','Segoe UI',system-ui,sans-serif;
  --font-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'Cascadia Code',monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1320;
    --surface:#171c2c;
    --surface-2:#1e2436;
    --border:#2b3348;
    --text:#e8eaf5;
    --text-dim:#a6adc4;
    --text-faint:#727ba0;
    --accent:#7fb0e8;
    --accent-soft:#1f3654;
    --gold:#e3b567;
    --gold-soft:#3a2e17;
    --danger:#e08079;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1320;
  --surface:#171c2c;
  --surface-2:#1e2436;
  --border:#2b3348;
  --text:#e8eaf5;
  --text-dim:#a6adc4;
  --text-faint:#727ba0;
  --accent:#7fb0e8;
  --accent-soft:#1f3654;
  --gold:#e3b567;
  --gold-soft:#3a2e17;
  --danger:#e08079;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
/* Per-path accent. Azure keeps the root blue; each other tab gets its own hue
   so the tab you are on is obvious without reading the label. */
[data-path="java"]       {--accent:#0f766e;--accent-soft:#d9f2ee;}
[data-path="distributed"]{--accent:#6d4aad;--accent-soft:#eae3f8;}
[data-path="scaling"]    {--accent:#2f7a46;--accent-soft:#dcf0e2;}
[data-path="events"]     {--accent:#a13a76;--accent-soft:#f9e3f1;}
[data-path="design"]     {--accent:#a8453a;--accent-soft:#fae3e0;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) [data-path="java"]       {--accent:#5fd0c3;--accent-soft:#12403c;}
  :root:not([data-theme="light"]) [data-path="distributed"]{--accent:#b49ae8;--accent-soft:#2d2247;}
  :root:not([data-theme="light"]) [data-path="scaling"]    {--accent:#6fd090;--accent-soft:#163a25;}
  :root:not([data-theme="light"]) [data-path="events"]     {--accent:#ef92c9;--accent-soft:#411733;}
  :root:not([data-theme="light"]) [data-path="design"]     {--accent:#ef938a;--accent-soft:#45201c;}
}
:root[data-theme="dark"] [data-path="java"]       {--accent:#5fd0c3;--accent-soft:#12403c;}
:root[data-theme="dark"] [data-path="distributed"]{--accent:#b49ae8;--accent-soft:#2d2247;}
:root[data-theme="dark"] [data-path="scaling"]    {--accent:#6fd090;--accent-soft:#163a25;}
:root[data-theme="dark"] [data-path="events"]     {--accent:#ef92c9;--accent-soft:#411733;}
:root[data-theme="dark"] [data-path="design"]     {--accent:#ef938a;--accent-soft:#45201c;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;}
img{max-width:100%;}
[hidden]{display:none!important;}
a{color:inherit;}
code{font-family:var(--font-mono);font-size:.9em;}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 90px;}
.kicker{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;color:var(--accent);font-weight:600;margin:0 0 10px;}
h1{font-family:var(--font-display);font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em;}
.subtitle{color:var(--text-dim);font-size:.98rem;line-height:1.55;max-width:62ch;margin:0 0 22px;}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:1;}
.bar.big{height:10px;}
.bar-fill{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .25s ease;}
.overall{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.overall-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--text-dim);}
.save-status{padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:.74rem;white-space:nowrap;}
.save-status.status-local{color:var(--text-faint);}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:22px;font-size:.8rem;color:var(--text-dim);}
.legend-item{display:flex;align-items:center;gap:6px;}
.pill{display:inline-flex;align-items:center;font-family:var(--font-mono);font-weight:600;font-size:.66rem;letter-spacing:.02em;padding:2px 8px;border-radius:999px;line-height:1.6;}
.pill.gold{background:var(--gold-soft);color:var(--gold);}
/* Tabs */
.site-head{margin-bottom:20px;}
.site-kicker{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;color:var(--text-faint);font-weight:600;margin:0 0 12px;}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px;}
.tab{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:inherit;cursor:pointer;box-shadow:var(--shadow);}
.tab:hover{border-color:var(--accent);}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);}
.tab-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.tab-label{font-family:var(--font-display);font-weight:700;font-size:.92rem;line-height:1.2;}
.tab-count{font-family:var(--font-mono);font-size:.68rem;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap;}
.tab-sub{font-size:.72rem;color:var(--text-dim);line-height:1.3;}
.tab .bar{height:4px;margin-top:6px;flex:none;}
/* .NET -> Java map */
details.map{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;}
details.map>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;font-family:var(--font-display);font-weight:700;font-size:.98rem;}
details.map>summary::-webkit-details-marker{display:none;}
details.map>summary::after{content:'+';font-family:var(--font-mono);font-size:1.1rem;color:var(--accent);}
details.map[open]>summary::after{content:'\2212';}
.map-hint{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--text-dim);}
.map-grid{display:grid;grid-template-columns:1fr 1fr;padding:0 18px 12px;font-size:.84rem;}
.map-grid>div{padding:7px 8px;border-top:1px solid var(--border);}
.map-grid .head{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.07em;font-size:.68rem;color:var(--text-faint);border-top:0;}
.map-grid .to{color:var(--accent);font-weight:500;}
.navchips{display:flex;gap:8px;overflow-x:auto;padding-block:10px;margin:0 -20px 26px;padding-inline:20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;}
.chip{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--text);min-width:126px;max-width:170px;}
.chip:hover,.chip:focus-visible{border-color:var(--accent);}
.chip.core{border-top:2px solid var(--gold);}
.chip.complete{border-color:var(--accent);background:var(--accent-soft);}
.chip-num{font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint);}
.chip-title{font-size:.76rem;font-weight:600;line-height:1.25;}
.chip-count{font-family:var(--font-mono);font-size:.7rem;color:var(--text-dim);font-variant-numeric:tabular-nums;}
.phase{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 18px;margin-bottom:18px;scroll-margin-top:76px;}
.eyebrow-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.eyebrow{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--accent);font-weight:600;}
.phase-title{font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin:0 0 6px;text-wrap:balance;}
.phase-desc{color:var(--text-dim);font-size:.9rem;margin:0 0 14px;max-width:64ch;}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.progress-count{font-family:var(--font-mono);font-size:.78rem;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;}
.items{display:flex;flex-direction:column;gap:2px;}
.item{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer;}
.item:hover{background:var(--surface-2);}
.chk{width:19px;height:19px;flex-shrink:0;margin-top:2px;accent-color:var(--accent);cursor:pointer;}
.item-body{display:flex;flex-direction:column;gap:4px;}
.item-text{font-size:.94rem;line-height:1.45;}
.item.done .item-text{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--border);}
.step{display:inline-block;font-family:var(--font-mono);font-weight:600;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--text-dim);vertical-align:1px;}
.step-failure{color:var(--danger);}
.step-solution{color:var(--accent);}
.step-interview{background:var(--accent-soft);color:var(--accent);}
.item.done .step{opacity:.6;}
.item-note{font-size:.8rem;color:var(--text-dim);line-height:1.42;padding-left:9px;border-left:2px solid var(--border);}
footer.page-footer{color:var(--text-faint);font-size:.78rem;text-align:center;margin-top:10px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){.bar-fill{transition:none;}}
@media (max-width:480px){
  .wrap{padding:20px 16px 70px;}
  .phase{padding:18px 16px 14px;}
  .chip{min-width:108px;}
  .tab{flex:1 1 100%;}
  .map-grid{padding:0 10px 10px;font-size:.8rem;}
}
</style>
</head>

      {k:'concept', text:`Kafka model: topics, partitions and offsets; brokers, replication factor and in-sync replicas; KRaft instead of ZooKeeper since Kafka 4.0`},
      {k:'concept', text:`Kafka durability: acks, replication factor, min.insync.replicas, unclean leader election`, deep:true, note:`acks=all with replication factor 3 and min.insync.replicas=2 is the usual durable baseline. Know exactly what each one gives up.`},
      {k:'example', text:`.NET: a Confluent.Kafka producer and a consumer in a group that commits offsets manually`},
      {k:'concept', text:`Azure Service Bus model: namespace → queue, or topic → subscriptions with SQL or correlation filters (the routing-key equivalent); peek-lock versus receive-and-delete; Basic, Standard and Premium tiers`, deep:true},
      {k:'concept', text:`Event Hubs is Kafka-shaped — partitions, consumer groups, checkpoints in Blob Storage, and a Kafka-protocol endpoint; Event Grid is push-based routing of Azure and custom events`},
      {k:'example', text:`.NET: ServiceBusProcessor from Azure.Messaging.ServiceBus, and EventProcessorClient from Azure.Messaging.EventHubs`},
      {k:'failure', text:`A message published to an exchange with no matching binding is dropped silently — the publish "succeeds" and nothing ever arrives`},
      {k:'solution', text:`The mandatory flag with a return handler, an alternate exchange, and declaring topology idempotently on both sides at startup`},
      {k:'interview', text:`"Walk me through a message from publish to ack in RabbitMQ. Where can it be lost, and what closes each gap?"`},
    ]
  },
  {
    id:'p5', num:'05', tag:'Core focus',
    title:`Delivery Semantics`,
    desc:`At-most-once, at-least-once, exactly-once — and which point in the pipeline each promise actually covers.`,
    items:[
      {k:'concept', text:`At-most-once: acknowledge or commit before processing — fast, and loses the message on a crash`},
      {k:'concept', text:`At-least-once: process, then acknowledge — the practical default, which guarantees duplicates sooner or later`, deep:true},
      {k:'concept', text:`Exactly-once is a property of the whole system, not the broker: "effectively once" is at-least-once plus idempotent processing`, deep:true, note:`When a vendor says exactly-once, ask: between which two points?`},
      {k:'example', text:`RabbitMQ: autoAck versus manual ack; unacked messages redelivered with the redelivered flag when a channel closes; publisher confirms on the way in`},
      {k:'example', text:`Kafka: commit before versus after processing, the traps in enable.auto.commit, the idempotent producer, and transactions for read-process-write`, deep:true, note:`Kafka's exactly-once covers Kafka-to-Kafka. It does not extend to your database or an outbound HTTP call.`},
      {k:'example', text:`Azure: Service Bus ReceiveAndDelete (at-most-once) versus PeekLock (at-least-once), lock duration and renewal; Event Hubs checkpoint frequency decides how much is reprocessed after a restart`},
      {k:'failure', text:`The handler outlives its lock or max.poll.interval.ms — the message is redelivered to another consumer while the first is still working, and Kafka evicts the slow consumer and rebalances`},
      {k:'failure', text:`The publisher fires and forgets, and the broker node dies before the write is replicated — the message is gone and nobody saw an error`},
      {k:'solution', text:`Confirm every publish (publisher confirms, acks=all, awaited SendMessageAsync), bound handler time, renew locks, and size max.poll.records to the work`},
      {k:'interview', text:`"Can you get exactly-once delivery? How would you get exactly-once processing from Kafka into Postgres?"`, note:`Outline: not across systems. Store the offset or message id in the same database transaction as the side effect, or use an inbox table.`},
    ]
  },
  {
    id:'p6', num:'06', tag:'Core focus',
    title:`Retries and Dead-Letter Queues`,
    desc:`What happens to the message that fails — once, ten times, or forever.`,
    items:[
      {k:'concept', text:`Transient versus permanent failures: retry the first, park the second`, deep:true},
      {k:'concept', text:`Retry layers: in-process (Polly), broker redelivery, and delayed retry — and why an immediate requeue is a hot loop`},
      {k:'concept', text:`Exponential backoff with jitter, and a retry budget so retries cannot become their own outage`},
      {k:'example', text:`RabbitMQ: dead-letter exchanges (x-dead-letter-exchange), delayed retry via TTL plus DLX retry queues, and the quorum-queue delivery limit`},
      {k:'example', text:`Kafka: the broker has no DLQ — build retry topics (orders.retry.5s, orders.retry.1m) and a dead-letter topic, and know what non-blocking retries cost in ordering`, deep:true},
      {k:'example', text:`Azure: Service Bus MaxDeliveryCount into the built-in dead-letter sub-queue with a reason, scheduled messages for delayed retry; Event Grid's retry policy and blob dead-lettering; Event Hubs has no DLQ at all`},
      {k:'failure', text:`A poison message — malformed JSON — is requeued forever: one message blocks the queue, CPU sits at 100%, and the logs flood`, deep:true},
      {k:'failure', text:`The DLQ fills quietly for three weeks and nobody notices`},
      {k:'solution', text:`Classify exceptions, bound retries, dead-letter with the original headers plus the failure reason, alert on DLQ depth, and keep a tested redrive tool`, deep:true},
      {k:'interview', text:`"Design retries for a payment consumer that calls a flaky third-party API. What goes to the DLQ, and who reprocesses it?"`},
    ]
  },
  {
    id:'p7', num:'07', tag:'Core focus',
    title:`Idempotency`,
    desc:`Handling duplicate events safely. At-least-once delivery makes this mandatory, not optional.`,
    items:[
      {k:'concept', text:`An idempotent consumer: handling the same message twice has the same effect as handling it once`, deep:true},
      {k:'concept', text:`Naturally idempotent operations (SET status = 'Paid', upserts) versus ones that are not (INSERT a payment, balance += 10, send an email)`},
      {k:'concept', text:`Choosing the dedup key: message id versus business key, and producer-assigned ids that survive a retry`},
      {k:'example', text:`Postgres: a processed_messages table with a unique constraint, written in the same transaction as the side effect`, deep:true, note:`The dedup record and the side effect must be written in the same transaction, or you have just moved the dual-write problem.`},
      {k:'example', text:`What the brokers give you, and where it stops: Kafka's idempotent producer (producer to broker only), Service Bus duplicate detection (a time window on the sender side), RabbitMQ nothing`},
      {k:'example', text:`Idempotent outbound calls: an Idempotency-Key header to the payment provider, with the outcome stored`},
      {k:'failure', text:`The consumer charges the card, crashes before the ack, the message is redelivered — and the customer is charged twice`},
      {k:'solution', text:`Dedup and side effect in one transaction; for external calls, pass an idempotency key and record the result before acknowledging`},
      {k:'interview', text:`"The same PaymentCaptured event arrives twice. Walk me through exactly how you prevent a double side effect — including a crash between the steps."`},
    ]
  },
  {
    id:'p8', num:'08', tag:'Core focus',
    title:`Ordering and Concurrency`,
    desc:`Every broker orders something. Know exactly what, and what quietly breaks it once you add consumers.`,
    items:[
      {k:'concept', text:`Global order is almost never needed; per-entity order usually is — key by the entity whose order matters`, deep:true},
      {k:'concept', text:`Ordering costs throughput: each ordered stream gets one consumer at a time, so parallelism comes from having many streams`},
      {k:'example', text:`RabbitMQ: FIFO per queue only with one consumer; single active consumer; the consistent-hash exchange to shard by key`},
      {k:'example', text:`Kafka: order within a partition only, set by the partition key; concurrency capped by partition count; the idempotent producer keeping order across retries`},
      {k:'example', text:`Azure: Service Bus sessions (SessionId) for per-entity FIFO with many receivers; the Event Hubs partition key`, deep:true},
      {k:'concept', text:`Concurrency inside one consumer: bounded parallelism with Channels or SemaphoreSlim, and hot keys that skew one partition`},
      {k:'failure', text:`What breaks ordering in practice: retries, parallel handlers, prefetch with concurrency, rebalances, and repartitioning`, deep:true},
      {k:'failure', text:`OrderCancelled is processed before OrderCreated after a retry — and the cancelled order comes back to life`},
      {k:'solution', text:`Version numbers on events and "ignore anything older than what I hold" on the read side; serialise per key, not globally`},
      {k:'solution', text:`Plan the partition count up front — raising it later reshuffles keys and breaks per-key ordering`, deep:true},
      {k:'interview', text:`"Events for one account must be processed in order, but you want 50 consumers. How do you do it in Kafka, RabbitMQ and Service Bus?"`},
    ]
  },
  {
    id:'p9', num:'09', tag:null,
    title:`Eventual Consistency`,
    desc:`Every service is consistent with itself now and with the others later. How much later is a product decision.`,
    items:[
      {k:'concept', text:`The consistency window: measure it, bound it, and agree it with the product owner`, deep:true},
      {k:'concept', text:`CQRS: a write model plus read models built from events — and rebuilding a projection from scratch`},
      {k:'concept', text:`Read-your-writes in the UI: 202 Accepted with a status resource, optimistic updates in Angular, or returning the written data`},
      {k:'example', text:`Orders writes, while Inventory and Search catch up from events — instrument the end-to-end lag on each broker`},
      {k:'failure', text:`A user places an order, refreshes, and it is not in "My orders" — so they place it again`},
      {k:'failure', text:`A consumer is down for an hour and its read model serves stale data with no sign that anything is wrong`},
      {k:'solution', text:`Show pending states in the UX, expose versions or timestamps, pair with idempotent commands, and alert on lag instead of hoping`},
      {k:'interview', text:`"How would you explain eventual consistency to a product manager, and how do you keep it bounded?"`},
    ]
  },
  {
    id:'p10', num:'10', tag:'Core focus',
    title:`Outbox and Inbox Patterns`,
    desc:`The patterns that make events correct rather than merely asynchronous. The centre of this tab.`,
    items:[
      {k:'concept', text:`The dual-write problem: you cannot atomically write your database and your broker`, deep:true, note:`This is the single most important idea in the tab. Every pattern below exists because of it.`},
      {k:'concept', text:`Transactional outbox: the business row and the outbox row in one transaction, then a relay publishes`, deep:true},
      {k:'concept', text:`Relay options: a polling publisher using SELECT … FOR UPDATE SKIP LOCKED, versus change data capture with Debezium over Postgres logical decoding`, deep:true},
      {k:'concept', text:`Inbox: the consumer-side mirror — record the message id and apply the change in one transaction`, deep:true},
      {k:'example', text:`.NET: build an outbox by hand with EF Core, Postgres and a BackgroundService relay publishing to RabbitMQ — then point the relay at Kafka and at Service Bus`},
      {k:'example', text:`Then compare the frameworks: MassTransit's EF Core outbox, Wolverine's Postgres outbox and inbox, NServiceBus's outbox`, note:`Check current licensing before choosing — MassTransit and NServiceBus both have commercial terms.`},
      {k:'failure', text:`SaveChanges succeeds and the publish fails, so the order exists and nobody hears of it — or the publish succeeds, the commit fails, and a ghost event goes out`},
      {k:'failure', text:`The relay publishes, then crashes before marking the row sent — the event goes out twice`},
      {k:'solution', text:`The outbox guarantees at-least-once publishing; the inbox makes consumption idempotent; together they give effectively-once`},
      {k:'interview', text:`"Why not just publish after SaveChanges? Why not wrap both in a TransactionScope?"`, note:`There is no practical distributed transaction spanning Postgres and RabbitMQ or Kafka. Service Bus transactions only span Service Bus entities.`},
    ]
  },
  {
    id:'p11', num:'11', tag:'Core focus',
    title:`Saga Pattern`,
    desc:`A business transaction that spans services, without a distributed lock — choreography versus orchestration.`,
    items:[
      {k:'concept', text:`A saga: a sequence of local transactions, each with a compensation, instead of a two-phase commit`, deep:true},
      {k:'concept', text:`Choreography: services react to each other's events — no coordinator, and the flow exists only implicitly`},
      {k:'concept', text:`Orchestration: a coordinator sends commands and tracks state — the flow is explicit, at the cost of one more component`, deep:true},
      {k:'concept', text:`Compensation is a semantic undo (RefundPayment), not a rollback — and some steps, like a sent email, cannot be undone at all`},
      {k:'example', text:`Build checkout — Order → Payment → Inventory → Shipping — both ways on RabbitMQ`},
      {k:'example', text:`Orchestrators to know: MassTransit state machines, Durable Functions on Azure, and Temporal`, note:`Look hard at these before hand-rolling an orchestrator. Durable timers and retries are most of the work.`},
      {k:'failure', text:`Payment succeeded, the inventory reservation timed out, and the refund message itself fails`},
      {k:'failure', text:`Choreography has grown to nine services and nobody can say what happens when shipping fails`},
      {k:'solution', text:`A timeout per step, idempotent compensations, persisted saga state, and a sweeper plus dashboard for stuck sagas`, deep:true},
      {k:'interview', text:`"Choreography or orchestration for checkout? Defend your choice, then tell me how it fails."`},
    ]
  },
  {
    id:'p12', num:'12', tag:null,
    title:`Event Versioning and Schema Evolution`,
    desc:`The most common way an event-driven system breaks in production is a schema change nobody coordinated.`,
    items:[
      {k:'concept', text:`Events are a public API: naming, ownership, versioning, and who is allowed to break them`, deep:true},
      {k:'concept', text:`Compatibility modes — backward, forward, full — and the deploy order each one forces`, deep:true, note:`Pick a compatibility mode before the first consumer ships. Changing it afterwards is a migration, not a setting.`},
      {k:'concept', text:`Safe evolution: additive fields with defaults, a tolerant reader, never reuse or renumber a field, never change a type in place`, deep:true},
      {k:'example', text:`Formats and registries: JSON, Avro and Protobuf; Confluent Schema Registry for Kafka, Azure Schema Registry in Event Hubs; a type-and-version header convention on RabbitMQ and Service Bus`},
      {k:'example', text:`CloudEvents as a shared envelope (native in Event Grid, with Kafka and AMQP bindings), and AsyncAPI to document topics and queues`},
      {k:'example', text:`Large payloads and size limits: the claim-check pattern with Blob Storage when an event outgrows the broker`},
      {k:'failure', text:`The producer renames customerId to clientId: old consumers read null and write corrupt data — and old events still sitting on the Kafka log keep the old shape for every replay`},
      {k:'solution', text:`For a real breaking change: a new event version, dual publishing through the migration, upcasting on read, or a versioned topic`, deep:true},
      {k:'solution', text:`Consumer-driven contract tests between producer and consumer, run in CI`},
      {k:'interview', text:`"You need to add a required field to an event with six consumers. How do you roll it out without downtime?"`},
    ]
  },
  {
    id:'p13', num:'13', tag:null,
    title:`EDA vs Microservices vs Request/Response`,
    desc:`Three things people treat as one. Knowing where each belongs is how you avoid events where a function call would do.`,
    items:[
      {k:'concept', text:`Microservices are an ownership and deployment boundary; EDA is a communication style — you can have either without the other`},
      {k:'concept', text:`Synchronous versus asynchronous: you gain failure isolation and loose coupling, and pay in debuggability and consistency`, deep:true},
      {k:'concept', text:`When not to use events: queries, user actions that need an answer now, and simple CRUD`},
      {k:'concept', text:`The usual hybrid — sync for queries and commands that need an immediate answer, async for propagation — and why request/reply over a broker is usually a smell`},
      {k:'concept', text:`Messaging versus event streaming: RabbitMQ and Service Bus versus Kafka and Event Hubs; know the names of the stream processors (Kafka Streams, Flink, Azure Stream Analytics)`},
      {k:'example', text:`Pick a broker per use case and write it down as an ADR: RabbitMQ, Kafka, Service Bus, Event Hubs, Event Grid — or a Postgres table with SKIP LOCKED`, deep:true, note:`RabbitMQ or Service Bus for task distribution, per-message retry and routing; Kafka or Event Hubs for replay, high throughput, and many independent readers of the same stream.`},
      {k:'failure', text:`A synchronous chain of five services at 99.9% each is 99.5% end to end — and one slow dependency exhausts threads all the way up`},
      {k:'failure', text:`The reverse mistake: a simple lookup turned into an asynchronous round-trip, adding complexity with no gain`},
      {k:'interview', text:`"Kafka, RabbitMQ or Azure Service Bus for an order-processing system — which, and why?"`},
    ]
  },
  {
    id:'p14', num:'14', tag:'Core focus',
    title:`Observability and Failure Handling`,
    desc:`Asynchronous systems fail quietly. Running them in production means watching the right numbers and rehearsing the failures.`,
    items:[
      {k:'concept', text:`What to watch: consumer lag or queue depth, age of the oldest message, throughput, DLQ depth, end-to-end latency, rebalance frequency`, deep:true},
      {k:'concept', text:`Tracing across a broker: W3C traceparent in message headers, and span links for batch consumers`, deep:true},
      {k:'example', text:`OpenTelemetry in .NET: the RabbitMQ.Client and Azure SDK instrumentation, Confluent.Kafka via contrib instrumentation or manual header propagation — exported to Application Insights`},
      {k:'example', text:`Where to look: the RabbitMQ management UI and Prometheus plugin; Kafka consumer-group lag; Azure Monitor metrics for Service Bus (active and dead-lettered messages) and Event Hubs (throughput, throttling)`},
      {k:'example', text:`Structured logs carrying correlation id and message id on every line`},
      {k:'failure', text:`Silent failure: the consumer is running, lag is climbing, and the logs show no errors — stuck on a lock or a rebalance loop`},
      {k:'failure', text:`Replaying a topic to fix a bug re-sends 40,000 emails`},
      {k:'solution', text:`Alert on lag and message age, not just exceptions; build the kill switch for outbound side effects before you ever replay`, deep:true, note:`Design the kill switch for outbound side effects before you need to replay a topic, not during the incident.`},
      {k:'solution', text:`Resilience in the consumer: a circuit breaker that pauses consumption, backpressure through prefetch or max.poll.records, and graceful shutdown that finishes in-flight work`},
      {k:'solution', text:`Testing: Testcontainers for RabbitMQ and Kafka, the Service Bus emulator, and redelivery and kill-mid-batch tests in CI`, deep:true},
      {k:'interview', text:`"Consumer lag is growing in production. Walk me through how you diagnose it."`},
    ]
  },
  {
    id:'p15', num:'15', tag:'Core focus',
    title:`Design a Production System in .NET + RabbitMQ`,
    desc:`Everything above in one system — built on RabbitMQ first, then carried to Kafka and Azure to prove the design is not tied to one broker.`,
    items:[
      {k:'concept', text:`Design doc first: Orders API (ASP.NET Core + Postgres), Payments, Inventory, Notifications — the events, the commands, and a topology diagram`, deep:true},
      {k:'example', text:`Build it on RabbitMQ: a topic exchange per bounded context, quorum queues, DLX-based delayed retry, publisher confirms`, deep:true},
      {k:'example', text:`Outbox in Orders, an inbox in every consumer, idempotent handlers throughout`},
      {k:'example', text:`Checkout as an orchestrated saga with compensations and per-step timeouts`},
      {k:'example', text:`A versioned envelope with correlation and causation ids, traced end to end in Application Insights`},
      {k:'example', text:`Add Kafka: publish order events keyed by orderId, and bring up a new analytics consumer group that replays from offset 0`, deep:true, note:`This is where the log earns its keep — a consumer that did not exist when the events were published still reads all of them.`},
      {k:'example', text:`Move to Azure: Service Bus topics with sessions for per-order ordering, deployed to Azure Container Apps with KEDA scaling on queue length, all in Bicep`},
      {k:'failure', text:`Chaos drill: kill a consumer mid-batch, restart the broker, inject a poison message — and prove nothing was lost or applied twice`, deep:true},
      {k:'solution', text:`Write up an ADR for each broker choice and a one-page DLQ runbook`},
      {k:'interview', text:`Present the system in ten minutes and defend every trade-off — the same shape as a system design interview`},
    ]
  },
];

    subtitle:'Built for a C#/.NET, PostgreSQL, and Angular developer — from your first <code>az login</code> to a certified, production-shaped deployment.',
    phases:AZURE_PHASES,
  },
  {
    id:'java',
    label:'Java',
    sublabel:'Language, Spring, persistence',
    kicker:'Java learning path',
    title:'Java Full-Stack Study Path',
    subtitle:'Built for a C#/.NET, PostgreSQL, and Angular developer — from your first <code>javac</code> to a production Spring Boot service. The systems tabs alongside this one are language-neutral.',
    map:{heads:['.NET', 'Java'], title:'Your .NET → Java map', hint:'what each tool you know becomes', rows:DOTNET_TO_JAVA},
    // v2: the systems phases moved out to their own tabs, so phase numbering shifted
    // and old p12+ checkmarks would land on different items. Fresh key rather than misalign.
    store:'java-v2',
    phases:JAVA_PHASES,
  },
  {
    id:'distributed',
    label:'Distributed Systems',
    sublabel:'Failure, consistency, consensus',
    kicker:'Distributed systems',
    title:'Distributed Systems',
    subtitle:'The theory underneath every other tab — partial failure, consistency, replication, consensus, and the patterns that keep a multi-service system correct. Each phase runs concept → example → failure scenario → solution → interview question, with examples in .NET, Postgres and Azure.',
    steps:true,
    // v2: rebuilt around the step loop, so old checkmarks would land on different items.
    store:'distributed-v2',
    phases:DISTRIBUTED_PHASES,
  },
  {
    id:'scaling',
    label:'Scaling',
    sublabel:'From one instance to many',
    kicker:'Scaling systems',
    title:'Scaling Systems',
    subtitle:'Measuring first, then the levers in the order they are usually worth pulling — stateless services, caching, the database ladder, load management, elasticity. Each phase runs concept → example → failure scenario → solution → interview question, with examples in .NET, Postgres and Azure.',
    steps:true,
    // v2: rebuilt around the step loop, so old checkmarks would land on different items.
    store:'scaling-v2',
    phases:SCALING_PHASES,
  },
  {
    id:'events',
    label:'Event-Driven',
    sublabel:'RabbitMQ, Kafka, Azure',
    kicker:'Event-driven architecture',
    title:'Event-Driven Architecture',
    subtitle:'Fifteen steps from “what is an event” to a production .NET system, learned across RabbitMQ, Kafka and Azure at once. Each phase runs the same loop: concept → example → failure scenario → solution → interview question.',
    map:{heads:['RabbitMQ', 'Kafka', 'Azure'], title:'One concept, three brokers', hint:'the same idea in each platform', rows:MESSAGING_MAP},
    steps:true,
    // v2: rebuilt as a 15-phase loop, so old checkmarks would land on different items.
    store:'events-v2',
    phases:EVENTS_PHASES,
  },
  {
    id:'design',
    label:'System Design',
    sublabel:'Apply it under constraints',
    kicker:'System design practice',
    title:'System Design Practice',

PATHS.forEach(function(path){
  path.phases.forEach(function(p){
    p.items.forEach(function(it, i){ it.id = p.id + 'i' + (i + 1); });
  });
});

const STORE_PREFIX = 'study-path:';
const TAB_KEY = STORE_PREFIX + 'active';
const states = {};
let storageOk = true;

function storeGet(key){
  try { return localStorage.getItem(key); }
  catch (e) { storageOk = false; return null; }
}
function storeSet(key, value){
  if (!storageOk) return;
  try { localStorage.setItem(key, value); }
  catch (e) { storageOk = false; }
}
function storeKeyFor(pathId){
  const path = PATHS.find(function(p){ return p.id === pathId; });
  return STORE_PREFIX + ((path && path.store) || pathId);
}
function loadStates(){
  PATHS.forEach(function(path){
    const set = new Set();
    const raw = storeGet(storeKeyFor(path.id));
    if (raw){
      try {
        const ids = JSON.parse(raw);
        if (Array.isArray(ids)) ids.forEach(function(id){ set.add(id); });
      } catch (e) {}
    }
    states[path.id] = set;
  });
}
function saveState(pathId){
  storeSet(storeKeyFor(pathId), JSON.stringify(Array.from(states[pathId])));
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pctOf(done, total){ return total ? Math.round((done / total) * 100) : 0; }
function countPhase(pathId, phase){
  const set = states[pathId];
  const done = phase.items.filter(function(i){ return set.has(i.id); }).length;
  return {done:done, total:phase.items.length};
}
function countPath(path){
  let done = 0, total = 0;
  path.phases.forEach(function(p){
    const c = countPhase(path.id, p);
    done += c.done;
    total += c.total;
  });
  return {done:done, total:total};
}

function renderTabs(){
  return '<div class="site-head">' +
    '<p class="site-kicker">Study paths</p>' +
    '<div class="tabs" role="tablist" aria-label="Study paths">' +
      PATHS.map(function(path, i){
        return '<button class="tab" role="tab" type="button" id="tab-' + path.id + '"' +
          ' aria-controls="panel-' + path.id + '" aria-selected="' + (i === 0) + '"' +
          ' tabindex="' + (i === 0 ? '0' : '-1') + '" data-tab="' + path.id + '" data-path="' + path.id + '">' +
          '<span class="tab-top">' +
            '<span class="tab-label">' + esc(path.label) + '</span>' +
            '<span class="tab-count" data-tabcount="' + path.id + '"></span>' +
          '</span>' +
          '<span class="tab-sub">' + esc(path.sublabel) + '</span>' +
          '<span class="bar"><span class="bar-fill" data-tabfill="' + path.id + '"></span></span>' +
        '</button>';
      }).join('') +
    '</div>' +
  '</div>';
}
const STEP_LABELS = {concept:'Concept', example:'Example', failure:'Failure', solution:'Solution', interview:'Interview'};

function renderItem(pathId, item){
  const checked = states[pathId].has(item.id);
  return '<label class="item' + (checked ? ' done' : '') + '">' +
    '<input type="checkbox" class="chk" data-path-id="' + pathId + '" data-id="' + item.id + '"' + (checked ? ' checked' : '') + '>' +
    '<span class="item-body">' +
      '<span class="item-text">' + (item.k ? '<span class="step step-' + item.k + '">' + STEP_LABELS[item.k] + '</span> ' : '') + esc(item.text) + (item.deep ? ' <span class="pill gold">Deep dive</span>' : '') + '</span>' +
      (item.note ? '<span class="item-note">' + esc(item.note) + '</span>' : '') +
    '</span>' +
  '</label>';
}
function renderPhase(pathId, phase){
  const key = pathId + '-' + phase.id;
  return '<section class="phase" id="' + key + '">' +
    '<div class="eyebrow-row">' +
      '<span class="eyebrow">Phase ' + phase.num + '</span>' +
      (phase.tag ? '<span class="pill gold">' + esc(phase.tag) + '</span>' : '') +
    '</div>' +
    '<h2 class="phase-title">' + esc(phase.title) + '</h2>' +
    '<p class="phase-desc">' + esc(phase.desc) + '</p>' +
    '<div class="progress-row">' +
      '<div class="bar"><div class="bar-fill" data-fill="' + key + '"></div></div>' +
      '<span class="progress-count" data-count="' + key + '"></span>' +
    '</div>' +
    '<div class="items">' + phase.items.map(function(i){ return renderItem(pathId, i); }).join('') + '</div>' +
  '</section>';
}
function renderNav(path){
  return '<nav class="navchips" aria-label="Jump to phase">' +
    path.phases.map(function(p){
      const key = path.id + '-' + p.id;
      return '<a href="#' + key + '" class="chip' + (p.tag ? ' core' : '') + '" data-chip="' + key + '">' +
        '<span class="chip-num">' + p.num + '</span>' +
        '<span class="chip-title">' + esc(p.title) + '</span>' +
        '<span class="chip-count"></span>' +
      '</a>';
    }).join('') +
  '</nav>';
}
function renderMap(path){
  if (!path.map) return '';
  return '<details class="map">' +
    '<summary><span>' + esc(path.map.title) + '</span><span class="map-hint">' + esc(path.map.hint) + '</span></summary>' +
    '<div class="map-grid" style="grid-template-columns:repeat(' + path.map.heads.length + ',1fr)">' +
      path.map.heads.map(function(h){ return '<div class="head">' + esc(h) + '</div>'; }).join('') +
      path.map.rows.map(function(r){
        return r.map(function(cell, i){ return '<div' + (i ? ' class="to"' : '') + '>' + esc(cell) + '</div>'; }).join('');
      }).join('') +
    '</div>' +
  '</details>';
}
function renderPanel(path, i){
  return '<div class="panel" role="tabpanel" id="panel-' + path.id + '" aria-labelledby="tab-' + path.id + '"' +
    ' data-panel="' + path.id + '" data-path="' + path.id + '"' + (i === 0 ? '' : ' hidden') + '>' +
    '<header>' +
      '<p class="kicker">' + esc(path.kicker) + '</p>' +
      '<h1>' + esc(path.title) + '</h1>' +
      '<p class="subtitle">' + path.subtitle + '</p>' +
      '<div class="overall">' +
        '<div class="bar big"><div class="bar-fill" data-overallfill="' + path.id + '"></div></div>' +
        '<div class="overall-meta">' +
          '<span data-overalltext="' + path.id + '"></span>' +
          '<span class="save-status' + (storageOk ? '' : ' status-local') + '">' +
            (storageOk ? 'Progress saved in this browser' : 'Progress can’t be saved in this view') +
          '</span>' +
        '</div>' +
      '</div>' +
      '<div class="legend">' +
        '<span class="legend-item"><span class="pill gold">Core focus</span> phases to slow down on for this stack</span>' +
        '<span class="legend-item"><span class="pill gold">Deep dive</span> topics worth studying beyond the surface</span>' +
        (path.steps ? '<span class="legend-item">' + Object.keys(STEP_LABELS).map(function(k){
          return '<span class="step step-' + k + '">' + STEP_LABELS[k] + '</span>';
        }).join(' ') + ' the loop each phase runs</span>' : '') +
      '</div>' +
    '</header>' +
    renderMap(path) +
    renderNav(path) +
    '<main class="phases">' + path.phases.map(function(p){ return renderPhase(path.id, p); }).join('') + '</main>' +
  '</div>';
}
function renderBody(){
  return '<div class="wrap">' +
    renderTabs() +
    PATHS.map(renderPanel).join('') +
    '<footer class="page-footer">Check off items as you go — progress is saved per tab in this browser.</footer>' +
  '</div>';
}

function update(){
  PATHS.forEach(function(path){
    const all = countPath(path);
    const pct = pctOf(all.done, all.total);
    document.querySelector('[data-overallfill="' + path.id + '"]').style.width = pct + '%';
    document.querySelector('[data-overalltext="' + path.id + '"]').textContent =
      all.done + ' / ' + all.total + ' complete · ' + pct + '%';
    document.querySelector('[data-tabfill="' + path.id + '"]').style.width = pct + '%';
    document.querySelector('[data-tabcount="' + path.id + '"]').textContent = all.done + '/' + all.total;
    path.phases.forEach(function(p){
      const key = path.id + '-' + p.id;
      const c = countPhase(path.id, p);
      document.querySelector('[data-fill="' + key + '"]').style.width = pctOf(c.done, c.total) + '%';
      document.querySelector('[data-count="' + key + '"]').textContent = c.done + ' / ' + c.total;
      const chip = document.querySelector('[data-chip="' + key + '"]');
      chip.classList.toggle('complete', c.total > 0 && c.done === c.total);
      chip.querySelector('.chip-count').textContent = c.done + '/' + c.total;
    });
  });
}

function activate(pathId, opts){
  const known = PATHS.some(function(p){ return p.id === pathId; });
  if (!known) return;
  PATHS.forEach(function(p){
    const on = p.id === pathId;
    const tab = document.querySelector('[data-tab="' + p.id + '"]');
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
    document.querySelector('[data-panel="' + p.id + '"]').hidden = !on;
  });
  storeSet(TAB_KEY, pathId);
  if (opts && opts.focus) document.querySelector('[data-tab="' + pathId + '"]').focus();
  if (opts && opts.scrollTop) window.scrollTo(0, 0);
}

// A hash like #java-p12 should open the Java tab, not just fail to scroll.
function activateFromHash(){
  const hash = (location.hash || '').replace(/^#/, '');
  if (!hash) return false;
  const path = PATHS.find(function(p){ return hash.indexOf(p.id + '-') === 0; });
  if (!path) return false;
  activate(path.id);
  const target = document.getElementById(hash);
  if (target) target.scrollIntoView();
  return true;
}

loadStates();
document.getElementById('app').innerHTML = renderBody();
update();

if (!activateFromHash()){
  activate(storeGet(TAB_KEY) || PATHS[0].id);
}
window.addEventListener('hashchange', activateFromHash);

document.querySelector('.tabs').addEventListener('click', function(e){
  const tab = e.target.closest('[data-tab]');
  if (tab) activate(tab.dataset.tab, {scrollTop:true});
});
document.querySelector('.tabs').addEventListener('keydown', function(e){
  const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (!dir) return;
  e.preventDefault();
  const ids = PATHS.map(function(p){ return p.id; });
  const current = ids.indexOf(document.activeElement.dataset.tab);
  if (current < 0) return;
  activate(ids[(current + dir + ids.length) % ids.length], {focus:true});
});

document.getElementById('app').addEventListener('change', function(e){
  const t = e.target;
  if (!t.classList || !t.classList.contains('chk')) return;
  const pathId = t.dataset.pathId;
  if (t.checked) states[pathId].add(t.dataset.id); else states[pathId].delete(t.dataset.id);
  t.closest('.item').classList.toggle('done', t.checked);
  update();
  saveState(pathId);
});
</script>
</body>
